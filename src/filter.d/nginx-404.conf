# Description: Counts 404s that are not static assets, to ban clients sweeping a site for URLs
# Note this is a volume heuristic rather than a judgement on any one request, so it needs a high maxretry
[Definition]
failregex = ^<HOST>[^"]+"[^"]*" 404\s
ignoreregex = ^[^"]+"[A-Z]+ (?i:\/\.well-known\/|\/(?:apple-app-site-association|manifest\.json|sitemap\.xml\.gz)\/?(?=[ ?"])|[^ ?"]*\.(?:apng|avi|avif|bmp|css|cur|eot|gif|heic|ico|jpe?g|js|m4a|m4v|mid|mkv|mov|mp3|mp4|oga|ogg|ogv|otf|pdf|png|srt|svg|tiff?|ttf|txt|vtt|wav|weba|webm|webmanifest|webp|woff2?|xml)(?=[ ?"]))
