# Description: Bans clients whose user agent is a library name, a bare product token, or missing
# Note this expects the combined log format, as it counts quoted fields to reach the user agent
[Definition]
failregex = ^<HOST> - - [^"]*"[A-Z]+ [^"]+"[^"]*"[^"]*" "(?:-|Mozilla\/[45]\.0|(?:[^"]*[ \/(-])?(?i:CyotekHTTP|CyotekWebCopy|(?:Windows)?PowerShell|github|grub|amazon-kendra-customer-id|Deno|dart|cpp-httplib|CakePHP|bun|ruby|rest|wget|curl|axios|PostmanRuntime|Grabber|go-http-client|ktor|java(?=\/)|GuzzleHttp|Guzzle|TestUserAgent|jsdom|python|okhttp|Mozlila|moblie|scrapy|node-fetch|HeadlessChrome|photon)(?:[ \/)-][^"]*)?)"$
ignoreregex = ^[^"]+"[A-Z]+ (?i:\/favicon\.ico|\/manifest\.json)\s
