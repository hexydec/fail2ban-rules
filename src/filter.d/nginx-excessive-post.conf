# Description: Counts write requests the application accepted or processed, to limit how many a client can make before it is banned
# Note admin routes and the WordPress core REST API are excluded, because an editor at work posts repeatedly and they refuse unauthenticated writes
# Note 401, 403, 404 and 429 are left to nginx-auth, nginx-404 and nginx-limit-reqs, so a write is not counted twice
[Definition]
failregex = ^<HOST>[^"]*"(?:POST|PUT|DELETE|PATCH) \/(?!admin|administrator|wp-admin|wp-json\/(?:wp\/v2|batch\/v1)(?=[\/? "])|(?:index\.php)?\?rest_route=(?i:(?:\/|%%2f)(?:wp(?:\/|%%2f)v2|batch(?:\/|%%2f)v1)(?:[\/& "]|%%2f))|typo3|magento|cmspages|cmsdesk)[^"]*" (?:20[0-247]|30[23]|4(?:00|22)|500)\s
ignoreregex = 