# Description: Counts write requests, to limit how many of them a client can make before it is banned
# Note admin routes and the WordPress core REST API are excluded, because an editor at work posts repeatedly and they refuse unauthenticated writes
[Definition]
failregex = ^<HOST>[^"]*"(?:POST|PUT|DELETE|PATCH) \/(?!admin|administrator|wp-admin|wp-json\/(?:wp\/v2|batch\/v1)(?=[\/? ])|(?:index\.php)?\?rest_route=(?i:(?:\/|%%2f)(?:wp(?:\/|%%2f)v2|batch(?:\/|%%2f)v1)(?:[\/& ]|%%2f))|typo3|magento|cmspages|cmsdesk)
ignoreregex = 