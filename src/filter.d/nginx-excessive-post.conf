# Description: Counts write requests, to limit how many of them a client can make before it is banned
# Note admin routes are excluded, because an editor at work posts repeatedly and legitimately
[Definition]
failregex = ^<HOST>[^"]*"(?:POST|PUT|DELETE|PATCH) \/(?!admin|administrator|wp-admin|typo3|magento|cmspages|cmsdesk)
ignoreregex = 