# Append to existing jail.conf
# Note this is Plesk specific for the actions and log file locations

[nginx-444]
enabled = true
filter = nginx-444
action = iptables-allports[name="nginx-444", port="80,443", protocol="tcp,udp"]
logpath = /var/www/vhosts/system/*/logs/*access*log
bantime = 3600
maxretry = 1

[nginx-404]
enabled = true
filter = nginx-404
action = iptables-allports[name="nginx-404", port="80,443", protocol="tcp,udp"]
